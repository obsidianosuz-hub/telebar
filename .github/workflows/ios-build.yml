name: Build Mobile Applications (Android & iOS)

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build Multi-Platform Apps
    runs-on: macos-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.44.8'

      - name: Install Dependencies
        run: |
          cd flutter_mobile
          flutter pub get

      - name: Build iOS Application
        run: |
          cd flutter_mobile
          flutter build ios --config-only
          cd ios
          xcodebuild -workspace Runner.xcworkspace -scheme Runner -configuration Release -sdk iphoneos CODE_SIGNING_ALLOWED=NO CODE_SIGN_IDENTITY="" PROVISIONING_PROFILE_SPECIFIER="" CONFIGURATION_BUILD_DIR=../build/ios/iphoneos
          cd ..
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -r telebar.ipa Payload

      - name: Upload iOS Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: telebar-ios-universal
          path: flutter_mobile/telebar.ipa
